worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Uploads & Buffer Sizing
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=5r/s;

    # Cloudflare Real IP Restoration
    # (Cloudflare transmits client IP in CF-Connecting-IP)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Sprint 9: 5-Service Upstream Definitions (Docker internal network) ──────
    upstream auth_backend {
        server auth-service:8081 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    upstream commerce_backend {
        server commerce-service:8082 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    # customer-finance-service: customer-ledger + finance + notification
    upstream customer_finance_backend {
        server customer-finance-service:8083 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    # inventory-procurement-service: inventory + procurement
    upstream inv_proc_backend {
        server inventory-procurement-service:8084 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    upstream production_backend {
        server production-service:8086 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # HTTP Server — Handles Certbot challenges and redirects to HTTPS
    server {
        listen 80;
        listen [::]:80;
        # Temporary staging domain; replace with rrjaggery.com www.rrjaggery.com for final launch
        server_name rrdentalneeds.online www.rrdentalneeds.online;

        # ACME challenge for Let's Encrypt / Certbot SSL
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # For Cloudflare Flexible SSL, traffic hits port 80 with X-Forwarded-Proto https
        # If not already HTTPS, redirect to HTTPS
        location / {
            if ($http_x_forwarded_proto != "https") {
                return 301 https://$host$request_uri;
            }
            # Fallback for direct port 80 behind Cloudflare Flexible SSL
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Static Uploads Media
        location /uploads/ {
            alias /var/www/uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # API Ingress Routing under Port 80
        location /api/v1/auth {
            limit_req zone=auth_rate_limit burst=10 nodelay;
            proxy_pass http://auth_backend;
            include /etc/nginx/proxy_params_production;
        }

        location /api/v1/commerce {
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://commerce_backend;
            include /etc/nginx/proxy_params_production;
        }

        location /api/v1/catalogue {
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://commerce_backend;
            include /etc/nginx/proxy_params_production;
        }

        location /api/v1/customers {
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://customer_finance_backend;
            include /etc/nginx/proxy_params_production;
        }

        location /api/v1/finance {
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://customer_finance_backend;
            include /etc/nginx/proxy_params_production;
        }

        location /api/v1/notifications {
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://customer_finance_backend;
            include /etc/nginx/proxy_params_production;
        }

        location = /api/v1/contact {
            limit_req zone=api_rate_limit burst=10 nodelay;
            proxy_pass http://customer_finance_backend;
            include /etc/nginx/proxy_params_production;
        }

        location /api/v1/inventory {
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://inv_proc_backend;
            include /etc/nginx/proxy_params_production;
        }

        location /api/v1/procurement {
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://inv_proc_backend;
            include /etc/nginx/proxy_params_production;
        }

        location /api/v1/production {
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://production_backend;
            include /etc/nginx/proxy_params_production;
        }
    }

    # HTTPS Server (Prepared for Production SSL)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        # Temporary staging domain; replace with rrjaggery.com www.rrjaggery.com for final launch
        server_name rrdentalneeds.online www.rrdentalneeds.online;

        # Production SSL Certificates (Mount paths to be configured upon domain issuance)
        ssl_certificate     /etc/nginx/ssl/live/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;

        # Hardened SSL Parameters
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Frontend Static Distribution
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Static Uploads Media
        location /uploads/ {
            alias /var/www/uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Authenticated & Public API Routes
        location /api/v1/auth {
            limit_req zone=auth_rate_limit burst=10 nodelay;
            proxy_pass http://auth_backend;
            include /etc/nginx/proxy_params_production;
        }

        location /api/v1/commerce {
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://commerce_backend;
            include /etc/nginx/proxy_params_production;
        }

        location /api/v1/catalogue {
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://commerce_backend;
            include /etc/nginx/proxy_params_production;
        }

        location /api/v1/customers {
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://customer_finance_backend;
            include /etc/nginx/proxy_params_production;
        }

        location /api/v1/finance {
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://customer_finance_backend;
            include /etc/nginx/proxy_params_production;
        }

        location /api/v1/notifications {
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://customer_finance_backend;
            include /etc/nginx/proxy_params_production;
        }

        location = /api/v1/contact {
            limit_req zone=api_rate_limit burst=10 nodelay;
            proxy_pass http://customer_finance_backend;
            include /etc/nginx/proxy_params_production;
        }

        location /api/v1/inventory {
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://inv_proc_backend;
            include /etc/nginx/proxy_params_production;
        }

        location /api/v1/procurement {
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://inv_proc_backend;
            include /etc/nginx/proxy_params_production;
        }

        location /api/v1/production {
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://production_backend;
            include /etc/nginx/proxy_params_production;
        }
    }
}
