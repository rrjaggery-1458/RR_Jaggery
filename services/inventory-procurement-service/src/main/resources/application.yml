server:
  port: ${INVENTORY_PROCUREMENT_SERVICE_PORT:8084}
  # Trust X-Forwarded-* headers from the Nginx reverse proxy (Docker internal network only).
  # Safe because Docker bridge isolates the upstream; untrusted clients cannot reach the service directly.
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 50
      min-spare: 5

spring:
  application:
    name: inventory-procurement-service
  main:
    lazy-initialization: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rr_jaggery_db}}
    username: ${DB_USER:rr_invproc}
    password: ${DB_PASSWORD:postgres_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 600000
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  jackson:
    serialization:
      fail-on-empty-beans: false

app:
  cors:
    # Comma-separated list of allowed CORS origins.
    # Production: set ALLOWED_ORIGINS in .env on the VPS.
    # Local dev: falls back to Vite dev server.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
