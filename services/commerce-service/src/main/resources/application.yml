server:
  port: ${COMMERCE_SERVICE_PORT:8082}
  tomcat:
    threads:
      max: 50
      min-spare: 5

spring:
  application:
    name: commerce-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB
  main:
    lazy-initialization: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rr_jaggery_db}?currentSchema=commerce_schema}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 600000
      auto-commit: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: commerce_schema
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads/products}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Razorpay Payment Gateway
# STATUS: Integration prepared. Set RAZORPAY_ENABLED=true ONLY after real credentials
# are configured via environment variables and the payment flow is fully tested.
razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:PENDING}
    secret: ${RAZORPAY_KEY_SECRET:PENDING}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:PENDING}
  enabled: ${RAZORPAY_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
