server:
  port: 8082

spring:
  application:
    name: commerce-service
  datasource:
    url: jdbc:h2:mem:commerce_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS COMMERCE_SCHEMA
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_schema: COMMERCE_SCHEMA
