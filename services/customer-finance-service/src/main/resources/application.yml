server:
  port: ${CUSTOMER_FINANCE_SERVICE_PORT:8083}
  # Trust X-Forwarded-* headers from the Nginx reverse proxy (Docker internal network only).
  # Safe because Docker bridge isolates the upstream; untrusted clients cannot reach the service directly.
  forward-headers-strategy: native

spring:
  application:
    name: customer-finance-service
  main:
    lazy-initialization: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rr_jaggery_db}}
    username: ${DB_USER:rr_custfin}
    password: ${DB_PASSWORD:postgres_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  jackson:
    serialization:
      fail-on-empty-beans: false

app:
  contact:
    recipient: ${CONTACT_EMAIL_RECIPIENT:rrjaggery@gmail.com}
    from: ${CONTACT_EMAIL_FROM:${SMTP_USERNAME:}}
  cors:
    # Comma-separated list of allowed CORS origins.
    # Production: set ALLOWED_ORIGINS in .env on the VPS.
    # Local dev: falls back to Vite dev server.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  forms:
    enabled: true
    api-base: /api/v1/customers/forms
    secondary-api-base: /api/v1/finance/forms
    owned-keys: WHOLESALE_ORDER,EXPENSE,INVESTMENT,STAFF,ATTENDANCE,PAYROLL
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  services:
    commerce-base-url: ${COMMERCE_SERVICE_URL:http://commerce-service:8082}
    inventory-base-url: ${INVENTORY_SERVICE_URL:http://inventory-procurement-service:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
