server:
  port: ${AUTH_SERVICE_PORT:8081}
  # Trust X-Forwarded-* headers from the Nginx reverse proxy (Docker internal network only).
  # Safe because Docker bridge isolates the upstream; untrusted clients cannot reach the service directly.
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 50           # default 200 is wasteful for dev; tune up for prod
      min-spare: 5      # keep 5 threads warm to avoid cold-start latency

spring:
  application:
    name: auth-service
  main:
    lazy-initialization: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rr_jaggery_db}?currentSchema=auth_schema}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10          # max concurrent DB connections
      minimum-idle: 5                # keep 5 warm connections ready
      connection-timeout: 3000       # 3 s — fail fast if pool exhausted
      idle-timeout: 300000           # release idle connections after 5 min
      max-lifetime: 600000           # recycle connections after 10 min
      auto-commit: false
  jpa:
    open-in-view: false              # avoid holding DB connections during view rendering
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: auth_schema
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

app:
  mail:
    from: ${CONTACT_EMAIL_FROM:${SMTP_USERNAME:}}
  cors:
    # Comma-separated list of allowed CORS origins.
    # Production: set ALLOWED_ORIGINS in .env on the VPS.
    # Local dev: falls back to Vite dev server.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
