version: '3.8'

networks:
  rr-network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: rr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rr_jaggery_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    networks:
      - rr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rr_jaggery_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── Sprint 9 Consolidated Services (5 JVM processes) ─────────────────────

  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: auth-service
    container_name: rr-auth-service
    restart: unless-stopped
    environment:
      AUTH_SERVICE_PORT: 8081
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx512m -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"
      DB_HOST: postgres
      DB_PORT: 5432
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-true}
      CONTACT_EMAIL_FROM: "${CONTACT_EMAIL_FROM:-${SMTP_USERNAME:-}}"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rr-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  commerce-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: commerce-service
    container_name: rr-commerce-service
    user: root
    restart: unless-stopped
    environment:
      COMMERCE_SERVICE_PORT: 8082
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx512m -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"
      DB_HOST: postgres
      DB_PORT: 5432
      # Points to consolidated inventory-procurement-service (port 8084)
      INVENTORY_SERVICE_URL: http://inventory-procurement-service:8084
      UPLOAD_DIR: /app/uploads/products
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_live_Sygkkdt4sA85ne}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-94qgHG0lpHpnfHUoD0rpHuzy}
      RAZORPAY_ENABLED: ${RAZORPAY_ENABLED:-true}
    ports:
      - "8082:8082"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rr-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  # Consolidated: customer-ledger-service + finance-service + notification-service
  customer-finance-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: customer-finance-service
    container_name: rr-customer-finance-service
    restart: unless-stopped
    environment:
      CUSTOMER_FINANCE_SERVICE_PORT: 8083
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"
      DB_HOST: postgres
      DB_PORT: 5432
      COMMERCE_SERVICE_URL: http://commerce-service:8082
      INVENTORY_SERVICE_URL: http://inventory-procurement-service:8084
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-true}
      CONTACT_EMAIL_FROM: "${CONTACT_EMAIL_FROM:-${SMTP_USERNAME:-}}"
      CONTACT_EMAIL_RECIPIENT: ${CONTACT_EMAIL_RECIPIENT:-rrjaggery@gmail.com}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rr-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  # Consolidated: inventory-service + procurement-service
  inventory-procurement-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: inventory-procurement-service
    container_name: rr-inventory-procurement-service
    restart: unless-stopped
    environment:
      INVENTORY_PROCUREMENT_SERVICE_PORT: 8084
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rr-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  production-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: production-service
    container_name: rr-production-service
    restart: unless-stopped
    environment:
      PRODUCTION_SERVICE_PORT: 8086
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"
      DB_HOST: postgres
      DB_PORT: 5432
      # Points to consolidated inventory-procurement-service (port 8084)
      INVENTORY_SERVICE_URL: http://inventory-procurement-service:8084
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rr-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  gateway:
    image: nginx:alpine
    container_name: rr-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      auth-service:
        condition: service_healthy
      commerce-service:
        condition: service_healthy
      customer-finance-service:
        condition: service_healthy
      inventory-procurement-service:
        condition: service_healthy
      production-service:
        condition: service_healthy
    networks:
      - rr-network
