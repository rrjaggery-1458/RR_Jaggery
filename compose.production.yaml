version: '3.8'

networks:
  rr-network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  certbot_data:
  ssl_certs:

services:
  postgres:
    image: postgres:16-alpine
    container_name: rr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rr_jaggery_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided}
    # Security: Database port 5432 is NOT mapped to the host in production.
    # It is strictly accessible over the private Docker bridge network 'rr-network'.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    networks:
      - rr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rr_jaggery_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── Sprint 9 Consolidated Services (5 JVM processes) ─────────────────────

  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: auth-service
    container_name: rr-auth-service
    restart: unless-stopped
    environment:
      AUTH_SERVICE_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rr_jaggery_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SPRING_PROFILES_ACTIVE: prod
    # Backend port 8081 remains internal to rr-network
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rr-network

  commerce-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: commerce-service
    container_name: rr-commerce-service
    restart: unless-stopped
    environment:
      COMMERCE_SERVICE_PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rr_jaggery_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided}
      # Points to consolidated inventory-procurement-service (port 8084)
      INVENTORY_SERVICE_URL: http://inventory-procurement-service:8084
      UPLOAD_DIR: /app/uploads/products
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-PENDING}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-PENDING}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-PENDING}
      RAZORPAY_ENABLED: ${RAZORPAY_ENABLED:-false}
      SPRING_PROFILES_ACTIVE: prod
    # Backend port 8082 remains internal to rr-network
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rr-network

  # Consolidated: customer-ledger-service + finance-service + notification-service
  customer-finance-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: customer-finance-service
    container_name: rr-customer-finance-service
    restart: unless-stopped
    environment:
      CUSTOMER_FINANCE_SERVICE_PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rr_jaggery_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided}
      COMMERCE_SERVICE_URL: http://commerce-service:8082
      # Points to consolidated inventory-procurement-service (port 8084)
      INVENTORY_SERVICE_URL: http://inventory-procurement-service:8084
      SPRING_PROFILES_ACTIVE: prod
    # Backend port 8083 remains internal to rr-network
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rr-network

  # Consolidated: inventory-service + procurement-service
  inventory-procurement-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: inventory-procurement-service
    container_name: rr-inventory-procurement-service
    restart: unless-stopped
    environment:
      INVENTORY_PROCUREMENT_SERVICE_PORT: 8084
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rr_jaggery_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided}
      SPRING_PROFILES_ACTIVE: prod
    # Backend port 8084 remains internal to rr-network
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rr-network

  production-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: production-service
    container_name: rr-production-service
    restart: unless-stopped
    environment:
      PRODUCTION_SERVICE_PORT: 8086
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rr_jaggery_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided}
      # Points to consolidated inventory-procurement-service (port 8084)
      INVENTORY_SERVICE_URL: http://inventory-procurement-service:8084
      SPRING_PROFILES_ACTIVE: prod
    # Backend port 8086 remains internal to rr-network
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rr-network

  gateway:
    image: nginx:alpine
    container_name: rr-gateway
    restart: unless-stopped
    # Public ingress on standard HTTP (80) and HTTPS (443)
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.production.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/proxy_params_production:/etc/nginx/proxy_params_production:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - uploads_data:/var/www/uploads:ro
      - certbot_data:/var/www/certbot:ro
      - ssl_certs:/etc/nginx/ssl:ro
    depends_on:
      - auth-service
      - commerce-service
      - customer-finance-service
      - inventory-procurement-service
      - production-service
    networks:
      - rr-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
