name: RR Jaggery Traders — CI/CD Pipeline

on:
  push:
    branches: [ main, arch/consolidate-5-services ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'Set to true to authorize attempting production deployment. (Default: false). Authorizes a deployment attempt only; does not ensure deployment is safe.'
        required: true
        type: boolean
        default: false

jobs:
  # ────────────────────────────────────────────────────────────────
  # Job 1: Frontend Build & Typecheck
  # ────────────────────────────────────────────────────────────────
  frontend-check:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.0.0
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Job 2: Backend Build & Tests (5-service Sprint 9 topology)
  # ────────────────────────────────────────────────────────────────
  backend-check:
    name: Backend Build & Service Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test All Services
        working-directory: services
        run: mvn -B clean test

      - name: Package JARs (skip tests — already ran)
        working-directory: services
        run: mvn -B package -DskipTests

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: services/*/target/*.jar
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Job 3: Validate Configuration Files
  # ────────────────────────────────────────────────────────────────
  config-check:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate SQL Schema File
        run: test -f infrastructure/docker/postgres/init-schemas.sql

      - name: Validate Nginx Production Config
        run: test -f infrastructure/nginx/nginx.production.conf

      - name: Validate Docker Compose (production)
        run: test -f compose.production.yaml

      - name: Validate Production Compose Structure
        run: |
          set -euo pipefail

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          env_file="$temp_dir/compose.env"
          printf '%s\n' \
            'DB_PASSWORD=CI_PLACEHOLDER_ONLY' \
            'RR_AUTH_DB_PASSWORD=CI_PLACEHOLDER_ONLY' \
            'RR_COMMERCE_DB_PASSWORD=CI_PLACEHOLDER_ONLY' \
            'RR_CUSTFIN_DB_PASSWORD=CI_PLACEHOLDER_ONLY' \
            'RR_INVPROC_DB_PASSWORD=CI_PLACEHOLDER_ONLY' \
            'RR_PRODUCTION_DB_PASSWORD=CI_PLACEHOLDER_ONLY' \
            'JWT_SECRET=CI_PLACEHOLDER_ONLY' > "$env_file"

          expected_services='["auth-service","commerce-service","customer-finance-service","gateway","inventory-procurement-service","postgres","production-service"]'
          required_volumes=("postgres_data" "uploads_data" "certbot_data" "ssl_certs")
          prohibited_publish_services=("postgres" "auth-service" "commerce-service" "customer-finance-service" "inventory-procurement-service" "production-service")

          validate_compose() {
            local compose_file="$1"
            local rendered_config="$temp_dir/rendered.json"
            local declared_volumes

            declared_volumes="$(awk '
              {
                line = $0
                sub(/\r$/, "", line)
              }
              line ~ /^volumes:[[:space:]]*($|#)/ {
                in_volumes = 1
                next
              }
              in_volumes && line ~ /^[^[:space:]#]/ { exit }
              in_volumes && line ~ /^  [A-Za-z0-9_-]+:[[:space:]]*($|#)/ {
                sub(/^  /, "", line)
                sub(/:.*/, "", line)
                print line
              }
            ' "$compose_file")"

            for volume in "${required_volumes[@]}"; do
              if ! grep -Fxq "$volume" <<< "$declared_volumes"; then
                echo "::error::Required persistent volume declaration '$volume' is missing."
                return 1
              fi
            done

            if ! docker compose --env-file "$env_file" --project-directory "$GITHUB_WORKSPACE" \
              -f "$compose_file" config --format json > "$rendered_config"; then
              echo "::error::Docker Compose could not render $compose_file."
              return 1
            fi

            if ! jq -e --argjson expected "$expected_services" \
              '.services | length == ($expected | length)' "$rendered_config" > /dev/null; then
              echo "::error::Production Compose must define exactly seven services."
              return 1
            fi
            if ! jq -e --argjson expected "$expected_services" \
              '.services | (keys | sort) == $expected' "$rendered_config" > /dev/null; then
              echo "::error::Production Compose service names do not match the approved set."
              return 1
            fi

            for volume in "${required_volumes[@]}"; do
              if ! jq -e --arg volume "$volume" '.volumes | has($volume)' "$rendered_config" > /dev/null; then
                echo "::error::Required persistent volume '$volume' is not present in the rendered Compose configuration."
                return 1
              fi
            done

            for service in "${prohibited_publish_services[@]}"; do
              if ! jq -e --arg service "$service" \
                '(.services[$service].ports // []) | length == 0' "$rendered_config" > /dev/null; then
                echo "::error::Service '$service' must not publish ports to the host."
                return 1
              fi
            done

            assert_volume_mount() {
              local service="$1"
              local volume="$2"
              local target="$3"
              if ! jq -e --arg service "$service" --arg volume "$volume" --arg target "$target" \
                '(.services[$service].volumes // []) | any(.type == "volume" and .source == $volume and .target == $target)' \
                "$rendered_config" > /dev/null; then
                echo "::error::Expected volume '$volume' mount at '$target' on '$service' is missing."
                return 1
              fi
            }

            assert_volume_mount "postgres" "postgres_data" "/var/lib/postgresql/data" || return 1
            assert_volume_mount "commerce-service" "uploads_data" "/app/uploads" || return 1
            assert_volume_mount "gateway" "uploads_data" "/var/www/uploads" || return 1
            assert_volume_mount "gateway" "certbot_data" "/var/www/certbot" || return 1
            assert_volume_mount "gateway" "ssl_certs" "/etc/nginx/ssl" || return 1
          }

          expect_rejection() {
            local description="$1"
            local fixture="$2"
            local expected_message="$3"
            local output_file="$temp_dir/rejection-output.log"

            if validate_compose "$fixture" > "$output_file" 2>&1; then
              echo "::error::Compose validator accepted the negative fixture: $description."
              return 1
            fi
            if grep -Fq -- "Docker Compose could not render" "$output_file"; then
              echo "::error::Compose validator failed with a generic Compose rendering error while testing $description."
              cat "$output_file"
              return 1
            fi
            if ! grep -Fq -- "$expected_message" "$output_file"; then
              echo "::error::Compose validator did not emit the expected rejection for $description."
              cat "$output_file"
              return 1
            fi
            echo "PASS: Compose validator rejected $description."
          }

          validate_compose "compose.production.yaml"
          echo "PASS: Production Compose structure is valid."

          sed 's/production-service/renamed-production-service/g' \
            compose.production.yaml > "$temp_dir/missing-service.yaml"
          expect_rejection "a missing expected service" "$temp_dir/missing-service.yaml" \
            "Production Compose service names do not match the approved set."

          awk '
            {
              line = $0
              sub(/\r$/, "", line)
              print line
              if (line ~ /^services:[[:space:]]*$/) {
                print "  redis:"
                print "    image: redis:alpine"
              }
            }
          ' compose.production.yaml > "$temp_dir/unexpected-service.yaml"
          if ! docker compose --env-file "$env_file" --project-directory "$GITHUB_WORKSPACE" \
            -f "$temp_dir/unexpected-service.yaml" config --format json > "$temp_dir/unexpected-service.json"; then
            echo "::error::Unexpected-service fixture could not be rendered."
            exit 1
          fi
          if ! jq -e '.services | has("redis")' "$temp_dir/unexpected-service.json" > /dev/null; then
            echo "::error::Rendered unexpected-service fixture does not contain redis."
            exit 1
          fi
          echo "PASS: Rendered unexpected-service fixture contains redis."
          expect_rejection "an unexpected service" "$temp_dir/unexpected-service.yaml" \
            "Production Compose must define exactly seven services."

          awk '
            {
              line = $0
              sub(/\r$/, "", line)
              if (line == "  ssl_certs:") next
              print line
            }
          ' compose.production.yaml > "$temp_dir/missing-volume.yaml"
          expect_rejection "a missing required persistent volume declaration" "$temp_dir/missing-volume.yaml" \
            "Required persistent volume declaration 'ssl_certs' is missing."

          awk '
            {
              line = $0
              sub(/\r$/, "", line)
              if (line == "    container_name: rr-postgres") {
                print line
                print "    ports:"
                print "      - \"5432:5432\""
                next
              }
              print line
            }
          ' compose.production.yaml > "$temp_dir/published-port.yaml"
          expect_rejection "a prohibited PostgreSQL host-port publication" "$temp_dir/published-port.yaml" \
            "Service 'postgres' must not publish ports to the host."

  # ────────────────────────────────────────────────────────────────
  # Job 4: Production Deploy
  # Requires: VPS_HOST, VPS_USER, VPS_SSH_KEY secrets in GitHub
  #
  # HARD SAFETY LOCK — Stage 6.1.3 (2026-10-28):
  # Production deployment is INTENTIONALLY DISABLED until Stage 6.2
  # safety prerequisites are resolved and explicitly approved:
  #   1. Trusted SSH host-key pinning (ssh-keyscan is NOT trustworthy).
  #   2. rsync --delete exclusion audit and protection of server-side
  #      TLS certificates, logs, and runtime credentials.
  #   3. Phase 2.2E database role and schema migration rehearsal and
  #      verification on the live VPS before any service restart.
  #   4. Removal or isolation of redundant npm/Maven on-host builds
  #      to avoid OOM on the 4 GB RAM VPS.
  #
  # To re-enable: remove "false &&" from the condition below ONLY
  # after all four prerequisites above are verified and approved.
  # ────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to OVHcloud VPS
    needs: [ frontend-check, backend-check, config-check ]
    runs-on: ubuntu-latest
    if: false && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.confirm_production_deploy == true || inputs.confirm_production_deploy == 'true')
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Download service JARs
        uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: services/

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "${VPS_HOST:-}" ]; then
            echo "::error::VPS_HOST secret is missing or empty in environment 'production'."
            exit 1
          fi
          if [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "::error::VPS_SSH_KEY secret is missing or empty in environment 'production'."
            exit 1
          fi
          if [ -z "${VPS_KNOWN_HOSTS:-}" ]; then
            echo "::error::VPS_KNOWN_HOSTS secret is missing or empty in environment 'production'."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write private key using printf to avoid shell interpolation artifacts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Write pinned verified host key (fails closed if presented key does not match)
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync repo to VPS
        run: |
          # Non-destructive sync: omit --delete on initial sync, exclude environment and backups
          rsync -az \
            --exclude '.git' \
            --exclude '.env*' \
            --exclude 'backups/' \
            --exclude 'node_modules' \
            --exclude 'services/*/target/classes' \
            --exclude 'compose.http-test.override.yaml' \
            --exclude 'infrastructure/nginx/nginx.http-test.conf' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/RR_Jaggery/

      - name: Run production deploy on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /home/ubuntu/RR_Jaggery && bash infrastructure/scripts/deploy.sh"

      - name: Post-deploy health check
        run: |
          sleep 30
          DOMAIN="${{ secrets.PRODUCTION_DOMAIN || 'localhost' }}"
          curl -f "https://$DOMAIN/api/v1/auth/health" || \
          curl -f "http://${{ secrets.VPS_HOST }}/api/v1/auth/health" || \
          echo "Health check could not reach production — verify manually."

# ────────────────────────────────────────────────────────────────
# Required GitHub Actions Secrets (set in repo Settings → Secrets → Actions):
#
#   VPS_HOST          — OVHcloud VPS public IP address
#   VPS_USER          — SSH user (e.g., deploy)
#   VPS_SSH_KEY       — Private SSH key for deploy user (PEM format)
#   VPS_KNOWN_HOSTS   — Verified host public key line (e.g. 15.235.246.77 ssh-ed25519 ...)
#   PRODUCTION_DOMAIN — Production domain (e.g., rrdentalneeds.online)
#
# Note: Production .env secrets (DB_PASSWORD, JWT_SECRET, etc.)
# must be placed on the VPS directly at /home/ubuntu/RR_Jaggery/.env
# They must NOT be stored in GitHub secrets or committed to git.
# ────────────────────────────────────────────────────────────────
