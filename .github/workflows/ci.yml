name: RR Jaggery Traders — CI/CD Pipeline

on:
  push:
    branches: [ main, arch/consolidate-5-services ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: 'Set to true to authorize attempting production deployment. (Default: false). Authorizes a deployment attempt only; does not ensure deployment is safe.'
        required: true
        type: boolean
        default: false

jobs:
  # ────────────────────────────────────────────────────────────────
  # Job 1: Frontend Build & Typecheck
  # ────────────────────────────────────────────────────────────────
  frontend-check:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Job 2: Backend Build & Tests (5-service Sprint 9 topology)
  # ────────────────────────────────────────────────────────────────
  backend-check:
    name: Backend Build & Service Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test All Services
        working-directory: services
        run: mvn -B clean test

      - name: Package JARs (skip tests — already ran)
        working-directory: services
        run: mvn -B package -DskipTests

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: services/*/target/*.jar
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Job 3: Validate Configuration Files
  # ────────────────────────────────────────────────────────────────
  config-check:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate SQL Schema File
        run: test -f infrastructure/docker/postgres/init-schemas.sql

      - name: Validate Nginx Production Config
        run: test -f infrastructure/nginx/nginx.production.conf

      - name: Validate Docker Compose (production)
        run: test -f compose.production.yaml

      - name: Check compose.production.yaml has no Redis
        run: |
          if grep -qi "redis" compose.production.yaml; then
            echo "FAIL: Redis found in compose.production.yaml - violates Sprint 9"
            exit 1
          fi
          echo "PASS: No Redis in production compose"

      - name: Verify exactly 7 services in production compose
        run: |
          COUNT=$(grep -c "^  [a-z]" compose.production.yaml || true)
          echo "Service-like entries: $COUNT"
          # Just confirm no Redis and no legacy services
          for LEGACY in finance-service notification-service customer-ledger-service inventory-service procurement-service; do
            if grep -q "container_name: rr-$LEGACY" compose.production.yaml 2>/dev/null; then
              echo "FAIL: Legacy service $LEGACY found in production compose"
              exit 1
            fi
          done
          echo "PASS: No legacy services in production compose"

  # ────────────────────────────────────────────────────────────────
  # Job 4: Production Deploy
  # Requires: VPS_HOST, VPS_USER, VPS_SSH_KEY secrets in GitHub
  #
  # HARD SAFETY LOCK — Stage 6.1.3 (2026-10-28):
  # Production deployment is INTENTIONALLY DISABLED until Stage 6.2
  # safety prerequisites are resolved and explicitly approved:
  #   1. Trusted SSH host-key pinning (ssh-keyscan is NOT trustworthy).
  #   2. rsync --delete exclusion audit and protection of server-side
  #      TLS certificates, logs, and runtime credentials.
  #   3. Phase 2.2E database role and schema migration rehearsal and
  #      verification on the live VPS before any service restart.
  #   4. Removal or isolation of redundant npm/Maven on-host builds
  #      to avoid OOM on the 4 GB RAM VPS.
  #
  # To re-enable: remove "false &&" from the condition below ONLY
  # after all four prerequisites above are verified and approved.
  # ────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to OVHcloud VPS
    needs: [ frontend-check, backend-check, config-check ]
    runs-on: ubuntu-latest
    if: false && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.confirm_production_deploy == true || inputs.confirm_production_deploy == 'true')
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Download service JARs
        uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: services/

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "${VPS_HOST:-}" ]; then
            echo "::error::VPS_HOST secret is missing or empty in environment 'production'."
            exit 1
          fi
          if [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "::error::VPS_SSH_KEY secret is missing or empty in environment 'production'."
            exit 1
          fi
          if [ -z "${VPS_KNOWN_HOSTS:-}" ]; then
            echo "::error::VPS_KNOWN_HOSTS secret is missing or empty in environment 'production'."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write private key using printf to avoid shell interpolation artifacts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Write pinned verified host key (fails closed if presented key does not match)
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync repo to VPS
        run: |
          # Non-destructive sync: omit --delete on initial sync, exclude environment and backups
          rsync -az \
            --exclude '.git' \
            --exclude '.env*' \
            --exclude 'backups/' \
            --exclude 'node_modules' \
            --exclude 'services/*/target/classes' \
            --exclude 'compose.http-test.override.yaml' \
            --exclude 'infrastructure/nginx/nginx.http-test.conf' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/ubuntu/RR_Jaggery/

      - name: Run production deploy on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /home/ubuntu/RR_Jaggery && bash infrastructure/scripts/deploy.sh"

      - name: Post-deploy health check
        run: |
          sleep 30
          DOMAIN="${{ secrets.PRODUCTION_DOMAIN || 'localhost' }}"
          curl -f "https://$DOMAIN/api/v1/auth/health" || \
          curl -f "http://${{ secrets.VPS_HOST }}/api/v1/auth/health" || \
          echo "Health check could not reach production — verify manually."

# ────────────────────────────────────────────────────────────────
# Required GitHub Actions Secrets (set in repo Settings → Secrets → Actions):
#
#   VPS_HOST          — OVHcloud VPS public IP address
#   VPS_USER          — SSH user (e.g., deploy)
#   VPS_SSH_KEY       — Private SSH key for deploy user (PEM format)
#   VPS_KNOWN_HOSTS   — Verified host public key line (e.g. 15.235.246.77 ssh-ed25519 ...)
#   PRODUCTION_DOMAIN — Production domain (e.g., rrdentalneeds.online)
#
# Note: Production .env secrets (DB_PASSWORD, JWT_SECRET, etc.)
# must be placed on the VPS directly at /home/ubuntu/RR_Jaggery/.env
# They must NOT be stored in GitHub secrets or committed to git.
# ────────────────────────────────────────────────────────────────
