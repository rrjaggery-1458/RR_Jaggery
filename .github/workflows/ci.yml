name: RR Jaggery Traders CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-check:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Shell
        working-directory: frontend
        run: npm run build

  backend-check:
    name: Backend Build & Service Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test All Services
        working-directory: services
        run: mvn -B clean test

  config-check:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate SQL Schema File
        run: test -f infrastructure/docker/postgres/init-schemas.sql

      - name: Validate Nginx Config Syntax
        run: test -f infrastructure/nginx/nginx.conf

      - name: Validate Docker Compose Configuration
        run: test -f docker-compose.yml
